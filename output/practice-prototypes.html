<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--border);background:transparent;border-radius:6px;padding:9px 12px}button:hover{background:var(--secondary)}button:focus-visible{outline:2px solid var(--ring);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.chooser{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.description{color:var(--muted-foreground);margin:0 0 16px;font-size:13px}.app{background:var(--card);padding:16px;border-radius:var(--radius)}.nav,.line,.toolbar,.grade,.words{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.nav{border-bottom:1px solid var(--border);padding-bottom:14px;justify-content:space-between}.brand{font-weight:650}.muted,small{color:var(--muted-foreground)}small{font-size:12px}.nav small{margin-left:12px}.progress{font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;margin:22px 0 16px}.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-foreground)}h1{font-size:30px;letter-spacing:-1px;margin:8px 0 12px}h2{font-size:23px;margin:6px 0 12px}h3{font-size:15px;margin:0 0 12px}p{line-height:1.5;margin:8px 0;font-size:14px}.answer{padding:18px 0}.word{font-size:21px;border:0;border-bottom:2px solid var(--warning);border-radius:0;padding:5px 8px}.word[aria-pressed=true]{background:var(--secondary);color:var(--foreground);border-color:var(--primary)}.word small{display:block;font-size:11px;margin-top:5px}.detail{background:var(--secondary);border-radius:var(--radius);padding:16px;margin:16px 0}.comparison{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:15px;margin:14px 0}.ipa{font-size:21px;font-family:serif}.toolbar{margin:18px 0}.grade{border-top:1px solid var(--border);padding-top:16px;margin-top:24px}.grade small{margin-right:auto}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px;color:var(--muted-foreground)}.split{display:grid;grid-template-columns:1fr 1.1fr;gap:24px}.split aside{border-left:1px solid var(--border);padding-left:24px}.rows{width:100%;border-collapse:collapse;margin-top:20px}.rows th{text-align:left;font-size:12px;color:var(--muted-foreground);font-weight:400}.rows td,.rows th{padding:12px 6px;border-bottom:1px solid var(--border)}.rows td{font-size:15px}.rows button{padding:7px}.notices{min-height:20px;font-size:12px;color:var(--muted-foreground)}select{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:7px}.demo{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-size:12px}.playing{color:var(--primary)}@media(max-width:550px){.split{grid-template-columns:1fr}.split aside{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:20px}.nav small{display:none}.grade small{width:100%}.rows td{font-size:13px}.word{font-size:18px}}@media(prefers-reduced-motion:no-preference){.detail{animation:appear .15s ease}@keyframes appear{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style></head><body>
<div class="chooser" aria-label="Prototype layouts"><button data-layout="inline" aria-pressed="true">Inline coach</button><button data-layout="table" aria-pressed="false">Word workbench</button><button data-layout="split" aria-pressed="false">Focus + inspector</button></div>
<p class="description" id="description"></p>
<div class="demo"><span>Interactive prototype · sample feedback</span><label>State <select id="state"><option value="words">Wrong words</option><option value="sounds">Pronunciation</option></select></label></div>
<div class="app"><div class="nav"><div class="brand">Prolang <small>Practice &nbsp; Deck &nbsp; Progress</small></div><span class="progress">1 of 5</span></div><div id="workspace"></div><div class="grade"><small>How well did you remember?</small><button data-grade>Again</button><button data-grade>Hard</button><button data-grade>Good</button><button data-grade>Easy</button></div><div class="footer"><span>German feedback is experimental</span><span>Synthetic reference audio · Help</span></div><p class="notices" role="status" id="notice"></p></div>
<script>
let layout='inline', state='words', selected=1;
const descriptions={inline:'One reading path: prompt → answer → selected word. The lightest layout, with fewer repeated labels.',table:'A compact comparison table. Best for scanning several incorrect words without opening each one.',split:'A compact exercise on the left, one selected word on the right. Best for repeated listening and retries.'};
const names=['die','Großmutter'], heard=['das','omer'], ipa=['diː','ɡʁoːsˌmʊtɐ'], detected=['diː','ɡʁoːsˌmʊtə'];
function listen(word){document.getElementById('notice').textContent='Playback preview: '+word+' · the implemented version will play the German reference.';}
function detail(){return '<div class="detail"><div class="line"><h3>'+names[selected]+'</h3><small>'+(state==='words'?'Different word detected':'Sound to review')+'</small></div><div class="comparison"><span class="muted">Expected</span><span class="'+(state==='sounds'?'ipa':'')+'">'+(state==='sounds'?ipa[selected]:names[selected])+'</span><span class="muted">You said</span><span class="'+(state==='sounds'?'ipa':'')+'">'+(state==='sounds'?detected[selected]:heard[selected])+'</span></div><button data-listen="'+names[selected]+'">▶ Listen to '+names[selected]+'</button></div>';}
function tokens(){return '<div class="words">'+names.map((n,i)=>'<button class="word" data-word="'+i+'" aria-pressed="'+(selected===i)+'">'+n+'<small>'+(state==='words'?'word differs':i===0?'matched':'sound differs')+'</small></button>').join('')+'</div>';}
function actions(){return '<div class="toolbar"><button class="primary" data-retry>Record again</button><button data-replay>▶ My recording</button></div>';}
function context(){return '<div class="label">Family · say it in German</div><h1>grandmother</h1>';}
function answer(){return '<div class="answer"><div class="label">Expected German</div>'+tokens()+'<p class="muted">Meine Großmutter backt gern.</p><small>My grandmother likes baking. · Plural: Großmütter</small></div>';}
function status(){return '<h3>'+(state==='words'?'Check the words first':'Words match · compare the sounds')+'</h3><p class="muted">'+(state==='words'?'Heard “das omer”. Select a word to compare and listen.':'Heard “die Großmutter”. Select a word to inspect its IPA.')+'</p>';}
function render(){document.getElementById('description').textContent=descriptions[layout];document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));let content='';
if(layout==='inline')content='<div class="top">'+context()+'<button data-listen="die Großmutter">▶ Reference</button></div>'+answer()+status()+detail()+actions();
if(layout==='split')content='<div class="top"><span class="label">Recall & pronounce</span><small>Feedback ready</small></div><div class="split"><section>'+context()+answer()+actions()+'<button data-listen="die Großmutter">▶ Full reference</button></section><aside>'+status()+detail()+'</aside></div>';
if(layout==='table')content='<div class="top">'+context()+'<button data-listen="die Großmutter">▶ Reference</button></div><h2>die Großmutter</h2><p class="muted">Meine Großmutter backt gern. · My grandmother likes baking.</p>'+status()+'<table class="rows"><thead><tr><th>Expected</th><th>You said</th><th>Review</th></tr></thead><tbody>'+names.map((n,i)=>'<tr><td>'+n+(state==='sounds'?'<p class="ipa">'+ipa[i]+'</p>':'')+'</td><td>'+(state==='words'?heard[i]:'<span class="ipa">'+detected[i]+'</span>')+'</td><td><button data-listen="'+n+'">▶ Listen</button></td></tr>').join('')+'</tbody></table>'+actions();
document.getElementById('workspace').innerHTML=content+'<details><summary>Recognition wrong?</summary><p>Retry the recording or accept a different target phrase.</p></details>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;render();}else if(b.dataset.word!==undefined){selected=Number(b.dataset.word);render();listen(names[selected]);}else if(b.dataset.listen)listen(b.dataset.listen);else if(b.hasAttribute('data-retry')){state='sounds';document.getElementById('state').value=state;render();document.getElementById('notice').textContent='Sample retry loaded: words match; pronunciation is now available.';}else if(b.hasAttribute('data-replay'))document.getElementById('notice').textContent='Recording playback is simulated in this prototype.';else if(b.hasAttribute('data-grade'))document.getElementById('notice').textContent='Preview selection: '+b.textContent+'. No progress has been saved.';});
document.getElementById('state').onchange=e=>{state=e.target.value;render();};render();
</script></body></html>
